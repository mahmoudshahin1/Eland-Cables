<!doctype html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Energya Connect — Advanced Cable Parameters (Mockup)</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--brand-500:#1d4fa1;--brand-600:#17407f;--brand-900:#0a1f42;--accent-500:#f04e30;--muted:#f4f6fa;--subtle:#f8fafc;--border:#e2e8f0;--info:#2563eb;--fd:"Poppins",system-ui;--fs:"Inter",system-ui}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:var(--fs);background:var(--muted);color:#1e293b;padding:18px 22px}
h1{font-family:var(--fd);font-size:20px;color:var(--brand-900)}
.crumb{font-size:12px;color:#94a3b8}
.bar{display:flex;justify-content:space-between;align-items:center;margin:6px 0 14px}
.chip{font-size:11px;background:#eef3fb;color:var(--brand-600);padding:4px 12px;border-radius:999px;font-weight:600}
.card{background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:0 1px 3px rgba(15,23,42,.06);margin-bottom:14px}
.gt{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--brand-500);font-weight:700;padding:12px 16px 4px}
.pg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:6px 16px 14px}
.f label{display:block;font-size:11px;color:#64748b;margin-bottom:3px}
.f select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:#fff}
.sw{display:inline-flex;align-items:center;gap:8px;font-size:13px}
.sw .t{width:34px;height:18px;border-radius:999px;background:var(--brand-500);position:relative}
.sw .t::after{content:"";width:14px;height:14px;border-radius:999px;background:#fff;position:absolute;top:2px;right:2px}
.tag{position:fixed;bottom:10px;right:12px;background:#0a1f42;color:#cfe0ff;font-size:11px;padding:6px 10px;border-radius:8px}
@media(max-width:900px){.pg{grid-template-columns:1fr}}
</style></head><body>
<div class="crumb">Cable Parameters › Advanced Cable Parameters</div>
<div class="bar"><h1>Advanced Cable Parameters</h1><span class="chip">27 Parameters Active · Filtered catalog: 3</span></div>
<div class="card"><div class="gt">Family &amp; Voltage</div><div class="pg">
  <div class="f"><label>Cable Family</label><select><option>UGC Power Cable</option></select></div>
  <div class="f"><label>Voltage Level / Class</label><select><option>MV</option></select></div>
  <div class="f"><label>Voltage Rating / Level</label><select><option>18/30 kV (19/33 kV)</option></select></div>
  <div class="f"><label>Standard &amp; Specification</label><select><option>IEC 60502-2</option></select></div>
</div></div>
<div class="card"><div class="gt">Conductor · Cores &amp; Colors</div><div class="pg">
  <div class="f"><label>Conductor Material</label><select><option>Copper (Cu)</option></select></div>
  <div class="f"><label>Construction Class</label><select><option>Class 2 — Stranded</option></select></div>
  <div class="f"><label>Conductor Shape</label><select><option>Compacted Round (rm)</option></select></div>
  <div class="f"><label>Conductor Size</label><select><option>240 mm²</option></select></div>
  <div class="f"><label>No. of Cores</label><select><option>3 Cores</option></select></div>
  <div class="f"><label>Conductor Water Blocking</label><select><option>No</option></select></div>
  <div class="f"><label>Core 1</label><select><option>Brown</option></select></div>
  <div class="f"><label>Core 2</label><select><option>Black</option></select></div>
  <div class="f"><label>Core 3</label><select><option>Grey</option></select></div>
</div></div>
<div class="card"><div class="gt">Insulation · Screen &amp; Armour</div><div class="pg">
  <div class="f"><label>Insulation Material</label><select><option>XLPE</option></select></div>
  <div class="f"><label>Insulation Color</label><select><option>Natural</option></select></div>
  <div class="f"><label>Outer Semi-Conductor</label><select><option>Extruded Cold Strippable</option></select></div>
  <div class="f"><label>Screen Type</label><select><option>Copper Wire + Tape</option></select></div>
  <div class="f"><label>Screen Cross-Section (CSA)</label><select><option>35 mm²</option></select></div>
  <div class="f"><label>Screen Water Tightness</label><div class="sw"><span class="t"></span> Yes</div></div>
  <div class="f"><label>Inner Sheath / Bedding</label><select><option>Extruded PVC Bedding</option></select></div>
  <div class="f"><label>Armour Layer</label><select><option>SWA</option></select></div>
  <div class="f"><label>Armour Water Tightness</label><div class="sw"><span class="t"></span> Yes</div></div>
</div></div>
<div class="card"><div class="gt">Sheathing · Compliance</div><div class="pg">
  <div class="f"><label>Outer Sheath (Jacket)</label><select><option>PVC</option></select></div>
  <div class="f"><label>Outer Sheath Color</label><select><option>Black</option></select></div>
  <div class="f"><label>Water Tight / Blocking</label><select><option>None</option></select></div>
  <div class="f"><label>Termite / Rodent Protection</label><select><option>None</option></select></div>
  <div class="f"><label>CPR Euroclass</label><select><option>N/A</option></select></div>
  <div class="f"><label>Special Installation Area</label><select><option>Direct Burial</option></select></div>
  <div class="f"><label>Special Engineering Req.</label><select><option>None</option></select></div>
  <div class="f"><label>Customer-Specific Identification</label><select><option>Standard</option></select></div>
</div></div>
<div class="tag">F · Advanced Cable Parameters</div>
</body></html>
